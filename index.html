<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>学生端 - 英语课堂抢答</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;padding:16px;max-width:500px;margin:0 auto;min-height:100vh}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h2{margin-bottom:12px;color:#333;text-align:center}
h3{margin-bottom:8px;color:#555}
input[type=text]{width:100%;padding:12px 16px;border:2px solid #d9d9d9;border-radius:10px;font-size:18px;outline:none;text-align:center;transition:border-color .2s}
input[type=text]:focus{border-color:#1890ff}
.btn{display:block;width:100%;padding:14px;border-radius:10px;border:none;cursor:pointer;font-size:18px;font-weight:bold;transition:all .2s;margin:8px 0;text-align:center}
.btn-primary{background:#1890ff;color:#fff}
.btn-primary:active{background:#096dd9}
.btn-race{background:linear-gradient(135deg,#ff6b6b,#ff8e53);color:#fff;font-size:28px;padding:30px;border-radius:16px;animation:breathe 2s ease-in-out infinite}
.btn-race:disabled{background:#d9d9d9;animation:none;color:#999}
.btn-race:active:not(:disabled){transform:scale(.96)}
@keyframes breathe{0%,100%{box-shadow:0 4px 12px rgba(255,107,107,.3)}50%{box-shadow:0 8px 24px rgba(255,107,107,.5)}}
.opt-btn{display:inline-block;width:calc(50% - 8px);padding:18px;margin:4px;border-radius:12px;border:2px solid #d9d9d9;background:#fff;font-size:22px;font-weight:bold;cursor:pointer;transition:all .15s;text-align:center}
.opt-btn:active{transform:scale(.95);background:#e6f7ff;border-color:#1890ff}
.opt-row{display:flex;flex-wrap:wrap;justify-content:center}
.status{text-align:center;padding:10px;border-radius:8px;margin:8px 0;font-size:15px}
.status.ok{background:#f6ffed;color:#52c41a}
.status.err{background:#fff2f0;color:#ff4d4f}
.status.warn{background:#fffbe6;color:#faad14}
.status.info{background:#e6f7ff;color:#1890ff}
.q-display{font-size:32px;text-align:center;padding:16px;font-weight:bold;color:#333;word-break:break-all}
.result{padding:16px;border-radius:12px;text-align:center;font-size:22px;font-weight:bold;margin:8px 0}
.result.correct{background:#f6ffed;color:#52c41a;border:2px solid #b7eb8f}
.result.wrong{background:#fff2f0;color:#ff4d4f;border:2px solid #ffccc7}
.locked-msg{text-align:center;padding:16px;background:#fff7e6;border-radius:10px;color:#faad14;font-size:18px;font-weight:bold;margin:8px 0}
.label{font-size:14px;color:#999;margin-bottom:4px}
.divider{height:1px;background:#e8e8e8;margin:12px 0}
</style>
</head>
<body>

<!-- 加入房间 -->
<div class="card" id="joinCard">
  <h2>🙋 学生端</h2>
  <div class="label">房间号</div>
  <input type="text" id="roomInput" placeholder="输入4位房间号" maxlength="4" inputmode="numeric" style="margin-bottom:12px">
  <div class="label">你的姓名</div>
  <input type="text" id="nameInput" placeholder="输入姓名" maxlength="10" style="margin-bottom:12px">
  <button class="btn btn-primary" id="joinBtn" onclick="joinRoom()">加入房间</button>
  <div class="status" id="joinStatus" style="display:none"></div>
</div>

<!-- 等待题目 -->
<div class="card" id="waitCard" style="display:none">
  <h2>✅ 已加入房间</h2>
  <div class="status ok" id="waitStatus">等待教师出题...</div>
  <div style="text-align:center;margin-top:12px">
    <button class="btn btn-danger" style="width:auto;display:inline-block;padding:8px 20px;font-size:14px" onclick="leaveRoom()">退出房间</button>
  </div>
</div>

<!-- 题目区域 -->
<div class="card" id="questionCard" style="display:none">
  <div id="modeLabel" style="text-align:center;color:#1890ff;font-size:14px;margin-bottom:4px"></div>
  <div class="q-display" id="qDisplay"></div>
</div>

<!-- 抢答按钮 -->
<div class="card" id="raceCard" style="display:none">
  <button class="btn btn-race" id="raceBtn" onclick="doRace()">🖐️ 抢答！</button>
</div>

<!-- 已被抢答提示 -->
<div class="card" id="lockedCard" style="display:none">
  <div class="locked-msg" id="lockedMsg"></div>
</div>

<!-- 回答区域 -->
<div class="card" id="answerCard" style="display:none">
  <h3 style="text-align:center">📝 请输入答案</h3>
  <div id="answerArea"></div>
</div>

<!-- 结果 -->
<div class="card" id="resultCard" style="display:none">
  <div id="resultDisplay"></div>
</div>

<script>
let peer=null, conn=null, myName='', canRace=false, curQ=null;

// ====== 加入房间 ======
function joinRoom(){
  const code=document.getElementById('roomInput').value.trim();
  const name=document.getElementById('nameInput').value.trim();

  if(!code||code.length!==4||isNaN(code)){
    showJoinStatus('请输入4位数字房间号','err');return;
  }
  if(!name){
    showJoinStatus('请输入姓名','err');return;
  }

  myName=name;
  showJoinStatus('正在连接...','warn');
  document.getElementById('joinBtn').disabled=true;

  peer=new Peer();

  peer.on('open',()=>{
    conn=peer.connect('wg'+code);

    conn.on('open',()=>{
      conn.send({type:'join',name});
      showJoinStatus('已连接！','ok');
      hide('joinCard');show('waitCard');
    });

    conn.on('data',d=>handleMsg(d));

    conn.on('close',()=>{
      showStatus('⚠️ 与教师端断开连接','err');
      resetToJoin();
    });

    conn.on('error',err=>{
      showJoinStatus('连接失败: '+err,'err');
      resetToJoin();
    });

    // 连接超时
    setTimeout(()=>{
      if(!conn?.open){
        showJoinStatus('连接超时，请检查房间号是否正确','err');
        resetToJoin();
      }
    },10000);
  });

  peer.on('error',err=>{
    showJoinStatus('错误: '+err.type,'err');
    resetToJoin();
  });
}

// ====== 处理教师消息 ======
function handleMsg(data){
  switch(data.type){
    case 'question':
      curQ=data;
      canRace=true;
      show('questionCard');show('raceCard');
      hide('waitCard');hide('lockedCard');hide('answerCard');hide('resultCard');

      // 显示题目
      const modeText={en2cn:'📖 英译汉',cn2en:'📖 汉译英',fill:'📖 挖空填空'};
      document.getElementById('modeLabel').textContent=modeText[data.mode]||'';
      document.getElementById('qDisplay').textContent=data.q;

      // 启用抢答按钮
      const btn=document.getElementById('raceBtn');
      btn.disabled=false;
      btn.textContent='🖐️ 抢答！';
      break;

    case 'locked':
      canRace=false;
      hide('raceCard');
      show('lockedCard');
      document.getElementById('lockedMsg').textContent='🏃 '+data.racerName+' 已抢答！等待结果...';
      break;

    case 'unlock':
      canRace=true;
      hide('lockedCard');hide('answerCard');
      show('raceCard');
      document.getElementById('raceBtn').disabled=false;
      break;

    case 'raceResult':
      // 抢答结果（所有人都能看到）
      showResult(data.racerName,data.correct,data.answer);
      break;

    case 'result':
      // 自己的抢答结果（更详细）
      // 已在 raceResult 中显示
      break;

    case 'raceFail':
      // 抢答失败
      canRace=false;
      break;
  }
}

// ====== 抢答 ======
function doRace(){
  if(!canRace||!conn?.open)return;
  canRace=false;
  const btn=document.getElementById('raceBtn');
  btn.disabled=true;
  btn.textContent='⏳ 已抢答，等待确认...';
  conn.send({type:'race'});
}

// ====== 提交答案 ======
function submitAnswer(answer){
  if(!conn?.open)return;
  conn.send({type:'answer',answer});
  hide('answerCard');
  show('lockedCard');
  document.getElementById('lockedMsg').textContent='📤 答案已提交，等待教师判定...';
}

// ====== 显示答案输入区 ======
function showAnswerInput(){
  hide('raceCard');hide('lockedCard');
  show('answerCard');
  const area=document.getElementById('answerArea');

  if(curQ?.mode==='fill'&&curQ?.fillOptions){
    // 填空题：显示ABCD选项按钮
    area.innerHTML='<div class="opt-row">'+
      ['A','B','C','D'].map(k=>
        '<button class="opt-btn" onclick="submitAnswer(\''+k+'\')">'+k+': '+curQ.fillOptions[k]+'</button>'
      ).join('')+
      '</div>';
  }else{
    // 英译汉/汉译英：文本输入
    area.innerHTML='<input type="text" id="ansInput" placeholder="输入答案" style="margin:8px 0">'+
      '<button class="btn btn-primary" onclick="submitTextAnswer()">提交</button>';
    setTimeout(()=>document.getElementById('ansInput')?.focus(),100);
  }
}

function submitTextAnswer(){
  const input=document.getElementById('ansInput');
  if(!input||!input.value.trim()){
    input.style.borderColor='#ff4d4f';return;
  }
  submitAnswer(input.value.trim());
}

// ====== 显示结果 ======
function showResult(name,correct,answer){
  show('resultCard');
  hide('lockedCard');hide('answerCard');hide('raceCard');

  const div=document.getElementById('resultDisplay');
  if(correct){
    div.innerHTML='<div class="result correct">✅ '+name+' 回答正确！<br>答案：'+answer+'</div>';
  }else{
    div.innerHTML='<div class="result wrong">❌ '+name+' 回答错误<br>正确答案：'+answer+'</div>';
  }
}

// ====== 退出房间 ======
function leaveRoom(){
  if(conn){conn.close();conn=null;}
  if(peer){peer.destroy();peer=null;}
  resetToJoin();
}

// ====== 工具函数 ======
function resetToJoin(){
  peer=null;conn=null;canRace=false;curQ=null;
  document.getElementById('joinBtn').disabled=false;
  hide('waitCard');hide('questionCard');hide('raceCard');hide('lockedCard');hide('answerCard');hide('resultCard');
  show('joinCard');
}

function showJoinStatus(msg,cls){
  const el=document.getElementById('joinStatus');
  el.textContent=msg;el.className='status '+cls;el.style.display='block';
}

function showStatus(msg,cls){
  const el=document.getElementById('waitStatus');
  if(el){el.textContent=msg;el.className='status '+cls;}
}

function show(id){document.getElementById(id).style.display='block';}
function hide(id){document.getElementById(id).style.display='none';}

// ====== 监听抢答后教师允许作答 ======
// 教师端收到 race 消息后自动通知学生可以作答
// 我们需要在这个流程中加入一个 "pleaseAnswer" 消息
// 但当前教师端代码中，race 后学生端需要自动显示答案输入
// 所以我们让教师端在锁定后立即发送 pleaseAnswer

// 更新 handleMsg 以处理 pleaseAnswer
const origHandleMsg=handleMsg;
handleMsg=function(data){
  if(data.type==='pleaseAnswer'){
    showAnswerInput();
    return;
  }
  origHandleMsg(data);
};
</script>
</body>
</html>
