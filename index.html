<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英语抢答 - 学生端</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;min-height:100vh;padding:16px;-webkit-tap-highlight-color:transparent}
.container{max-width:480px;margin:0 auto}
h1{text-align:center;color:#333;font-size:22px;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.join-section{text-align:center}
.join-section input{width:200px;padding:12px 16px;border:2px solid #d9d9d9;border-radius:8px;font-size:20px;text-align:center;letter-spacing:8px;outline:none}
.join-section input:focus{border-color:#1890ff}
.join-section button{display:block;width:200px;margin:12px auto 0;padding:10px;border:none;border-radius:8px;background:#1890ff;color:#fff;font-size:16px;cursor:pointer}
.join-section button:active{background:#40a9ff}
.name-section{text-align:center;margin-top:12px}
.name-section input{width:200px;padding:10px 16px;border:2px solid #d9d9d9;border-radius:8px;font-size:16px;text-align:center;outline:none}
.name-section input:focus{border-color:#1890ff}
.name-section button{display:block;width:200px;margin:10px auto 0;padding:10px;border:none;border-radius:8px;background:#52c41a;color:#fff;font-size:16px;cursor:pointer}
.question-display{font-size:24px;text-align:center;padding:20px 0;min-height:64px;color:#333;word-break:break-all}
.msg{text-align:center;font-size:16px;min-height:24px;padding:4px 0}
.msg.correct{color:#52c41a}
.msg.wrong{color:#ff4d4f}
.race-btn{display:block;width:80%;max-width:280px;margin:12px auto;padding:14px;border:none;border-radius:12px;background:#ff4d4f;color:#fff;font-size:20px;font-weight:bold;cursor:pointer;transition:all .2s}
.race-btn:disabled{background:#d9d9d9;cursor:not-allowed}
.race-btn:active:not(:disabled){background:#cf1322;transform:scale(.97)}
.answer-section{display:none;text-align:center;margin-top:12px}
.answer-section input{width:80%;max-width:280px;padding:10px 14px;border:2px solid #d9d9d9;border-radius:8px;font-size:16px;text-align:center;outline:none}
.answer-section input:focus{border-color:#1890ff}
.answer-section .submit-btn{display:inline-block;margin-top:10px;padding:10px 32px;border:none;border-radius:8px;background:#1890ff;color:#fff;font-size:16px;cursor:pointer}
.options-section{display:none;text-align:center;margin-top:12px}
.options-section button{display:block;width:80%;max-width:280px;margin:8px auto;padding:12px;border:2px solid #d9d9d9;border-radius:8px;background:#fff;font-size:16px;cursor:pointer}
.options-section button:active{border-color:#1890ff;background:#e6f7ff}
.correct-answer{text-align:center;font-size:14px;color:#888;margin-top:8px;display:none}
.firebase-config-notice{background:#fff7e6;border:1px solid #ffd591;border-radius:8px;padding:12px;margin-bottom:14px;font-size:13px;color:#ad6800;display:none}
</style>
</head>
<body>
<div class="container">
  <h1>英语抢答</h1>

  <div class="firebase-config-notice" id="configNotice">
    请先配置 Firebase：将下方 firebaseConfig 中的占位符替换为你的 Firebase 项目配置。
  </div>

  <!-- 加入房间 -->
  <div class="card join-section" id="joinSection">
    <div style="margin-bottom:8px;color:#666">输入房间号</div>
    <input type="text" id="roomInput" maxlength="4" placeholder="----" inputmode="numeric">
    <button onclick="joinRoom()">加入房间</button>
  </div>

  <!-- 输入姓名 -->
  <div class="card name-section" id="nameSection" style="display:none">
    <div style="margin-bottom:8px;color:#666">确认姓名</div>
    <input type="text" id="nameInput" placeholder="你的姓名">
    <button onclick="confirmName()">确认</button>
  </div>

  <!-- 主内容 -->
  <div id="mainContent" style="display:none">
    <div class="card">
      <div class="question-display" id="question">等待出题...</div>
      <div class="msg" id="msg"></div>
      <button class="race-btn" id="raceBtn" onclick="doRace()">点击抢答</button>

      <div class="answer-section" id="answerSection">
        <input type="text" id="answerInput" placeholder="输入你的答案">
        <button class="submit-btn" onclick="submitAnswer()">提交答案</button>
      </div>

      <div class="options-section" id="optionsSection">
        <button id="optA" onclick="check('A')">A</button>
        <button id="optB" onclick="check('B')">B</button>
        <button id="optC" onclick="check('C')">C</button>
        <button id="optD" onclick="check('D')">D</button>
      </div>

      <div class="correct-answer" id="correctAnswer"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, update, remove, onValue, onDisconnect, push, onChildRemoved } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ============================================================
// Firebase 配置 - 与教师端保持一致
// ============================================================
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

if (firebaseConfig.apiKey === "YOUR_API_KEY") {
  document.getElementById('configNotice').style.display = 'block';
}

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let myName = "";
let myId = "";
let roomId = "";
let currentMode = "";
let optionsLoaded = false;
let hasRaced = false;

// ============================================================
// 加入房间
// ============================================================
window.joinRoom = async function() {
  const code = document.getElementById('roomInput').value.trim();
  if (code.length !== 4) { alert("请输入4位房间号"); return; }

  // 检查房间是否存在
  const roomSnap = await get(ref(db, 'rooms/' + code));
  if (!roomSnap.exists()) { alert("房间不存在，请检查房间号"); return; }

  roomId = code;

  // 生成学生ID
  myId = push(ref(db, 'rooms/' + roomId + '/students')).key;

  // 显示姓名输入
  document.getElementById('joinSection').style.display = 'none';
  document.getElementById('nameSection').style.display = 'block';
  document.getElementById('nameInput').focus();
};

// ============================================================
// 确认姓名并加入
// ============================================================
window.confirmName = async function() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { alert("姓名不能为空！"); return; }

  myName = name;

  // 写入学生信息
  await set(ref(db, 'rooms/' + roomId + '/students/' + myId), {
    name: myName,
    joinedAt: Date.now()
  });

  // 断线自动移除
  onDisconnect(ref(db, 'rooms/' + roomId + '/students/' + myId)).remove();

  // 切换到主界面
  document.getElementById('nameSection').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';

  // 开始监听
  listenQuestion();
  listenCurrentRacer();
  listenResult();
};

// ============================================================
// 监听题目变化
// ============================================================
function listenQuestion() {
  onValue(ref(db, 'rooms/' + roomId + '/question'), (snap) => {
    const data = snap.val();
    if (!data) return;

    document.getElementById('question').innerText = data.q || "等待出题...";
    currentMode = data.mode;
    optionsLoaded = false;
    hasRaced = false;

    // 题目变化时重置界面
    const lock = data.lock === "1";
    document.getElementById('raceBtn').disabled = lock;
    document.getElementById('msg').innerText = "";
    document.getElementById('msg').className = "msg";
    document.getElementById('answerSection').style.display = 'none';
    document.getElementById('optionsSection').style.display = 'none';
    document.getElementById('correctAnswer').style.display = 'none';

    if (!lock) {
      document.getElementById('raceBtn').style.display = 'block';
    }
  });
}

// ============================================================
// 监听抢答结果（谁抢到了）
// ============================================================
function listenCurrentRacer() {
  onValue(ref(db, 'rooms/' + roomId + '/currentRacer'), async (snap) => {
    const racerId = snap.val();
    if (!racerId) return;

    // 获取抢答者姓名
    const nameSnap = await get(ref(db, 'rooms/' + roomId + '/students/' + racerId + '/name'));
    const racerName = nameSnap.val() || "某同学";

    document.getElementById('raceBtn').style.display = 'none';
    document.getElementById('raceBtn').disabled = true;

    if (racerId === myId) {
      // 我抢到了
      document.getElementById('msg').innerText = "你抢到了答题权！";
      document.getElementById('msg').className = "msg";

      if (currentMode === "fill") {
        if (!optionsLoaded) {
          // 请求正确片段来生成选项（教师端会在 fill 模式下提供选项数据）
          loadFillOptions();
        }
        document.getElementById('optionsSection').style.display = 'block';
        document.getElementById('answerSection').style.display = 'none';
      } else {
        document.getElementById('answerSection').style.display = 'block';
        document.getElementById('optionsSection').style.display = 'none';
        document.getElementById('answerInput').focus();
      }
    } else {
      // 别人抢到了
      document.getElementById('msg').innerText = racerName + " 抢到了答题权";
      document.getElementById('msg').className = "msg";
      document.getElementById('answerSection').style.display = 'none';
      document.getElementById('optionsSection').style.display = 'none';
    }
  });
}

// ============================================================
// 填空题选项加载
// ============================================================
async function loadFillOptions() {
  // 从 Firebase 获取填空题选项数据（教师端生成）
  const optsSnap = await get(ref(db, 'rooms/' + roomId + '/fillOptions'));
  if (optsSnap.exists()) {
    const opts = optsSnap.val();
    const labels = ['A', 'B', 'C', 'D'];
    labels.forEach(l => {
      document.getElementById('opt' + l).innerText = opts[l] || '';
    });
  }
  optionsLoaded = true;
}

// ============================================================
// 抢答
// ============================================================
window.doRace = async function() {
  if (hasRaced) return;
  hasRaced = true;

  // 先检查是否已被锁定
  const lockSnap = await get(ref(db, 'rooms/' + roomId + '/question/lock'));
  if (lockSnap.val() === "1") {
    document.getElementById('msg').innerText = "已被别人抢到了";
    document.getElementById('raceBtn').disabled = true;
    return;
  }

  // 写入抢答记录
  await set(ref(db, 'rooms/' + roomId + '/races/' + myId), {
    name: myName,
    timestamp: Date.now()
  });
};

// ============================================================
// 提交答案（文本输入模式）
// ============================================================
window.submitAnswer = async function() {
  const answer = document.getElementById('answerInput').value.trim();
  if (!answer) { alert("请输入答案！"); return; }

  // 写入学生答案到 Firebase，教师端会判断对错
  await update(ref(db, 'rooms/' + roomId + '/result'), {
    studentAnswer: answer
  });

  document.getElementById('answerSection').style.display = 'none';
  document.getElementById('msg').innerText = "答案已提交，等待判断...";
};

// ============================================================
// 选择题提交（填空模式）
// ============================================================
window.check = async function(sel) {
  const val = document.getElementById('opt' + sel).innerText;

  await update(ref(db, 'rooms/' + roomId + '/result'), {
    studentAnswer: val
  });

  document.getElementById('optionsSection').style.display = 'none';
  document.getElementById('msg').innerText = "答案已提交，等待判断...";
};

// ============================================================
// 监听答题结果
// ============================================================
function listenResult() {
  onValue(ref(db, 'rooms/' + roomId + '/result'), (snap) => {
    const data = snap.val();
    if (!data || data.correct === null || data.correct === undefined) return;

    const msgEl = document.getElementById('msg');
    const correctEl = document.getElementById('correctAnswer');

    if (data.correct) {
      msgEl.innerText = "回答正确！";
      msgEl.className = "msg correct";
    } else {
      msgEl.innerText = "回答错误！";
      msgEl.className = "msg wrong";
    }

    if (data.answer && !data.correct) {
      correctEl.innerText = "正确答案：" + data.answer;
      correctEl.style.display = 'block';
    }

    document.getElementById('answerSection').style.display = 'none';
    document.getElementById('optionsSection').style.display = 'none';
  });
}
</script>
</body>
</html>
